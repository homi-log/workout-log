<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>운동일지</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root {
  --bg:#f5f2ed; --paper:#faf8f5; --ink:#1a1a18; --ink2:#4a4a46; --ink3:#8a8a84;
  --rule:#ddd8ce; --accent:#2d5a3d; --accent-light:#eaf3ec; --warn:#c0392b;
  --plan:#997300; --plan-bg:#fffbe6; --plan-border:#ffe066;
  --mono:'IBM Plex Mono',monospace; --sans:'Noto Sans KR',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;min-height:100vh;padding-bottom:60px}
.shell{max-width:600px;margin:0 auto;padding:24px 16px 80px}

/* 헤더 */
.app-header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:24px}
.app-title{font-size:1.3rem;font-weight:700;letter-spacing:-.02em}
.app-title span{font-family:var(--mono);font-size:.65rem;color:var(--ink3);display:block;margin-bottom:2px}
.header-actions{display:flex;gap:6px;align-items:center}

/* 탭 */
.tabs{display:flex;border-bottom:1px solid var(--rule);margin-bottom:20px}
.tab{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;padding:10px 16px;cursor:pointer;color:var(--ink3);border:none;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;transition:all .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.panel{display:none}.panel.active{display:block}

/* 버튼 */
.btn{font-family:var(--mono);font-size:.72rem;padding:8px 14px;border-radius:6px;cursor:pointer;border:1px solid;transition:all .15s;letter-spacing:.03em}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-primary:active{background:#1e3d2a}
.btn-ghost{background:transparent;color:var(--ink2);border-color:var(--rule)}.btn-ghost:active{border-color:var(--ink3)}
.btn-convert{background:var(--plan-bg);color:var(--plan);border-color:var(--plan-border);font-size:.68rem;padding:5px 10px}
.btn-danger{background:transparent;color:var(--warn);border-color:transparent;padding:4px 8px;font-size:.68rem}
.btn-sm{padding:5px 10px;font-size:.68rem}
#sync-btn{display:inline-flex;align-items:center;gap:2px;padding:5px 9px}
#sync-btn svg{display:block}
#sync-btn.synced{color:var(--accent);background:var(--accent-light);border-color:#c0dcc8}
#sync-check{display:none}
#sync-btn.synced #sync-check{display:inline;font-size:.6rem;font-weight:700;line-height:1}

/* 필터바 */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;align-items:center}
.filter-input-wrap{position:relative;flex:1}
.filter-input-wrap input{font-family:var(--mono);font-size:.75rem;padding:8px 30px 8px 10px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink);outline:none;width:100%}
.filter-input-wrap input:focus{border-color:var(--accent)}
.filter-clear-btn{display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);width:19px;height:19px;border:none;border-radius:50%;background:var(--ink3);color:#fff;font-size:.6rem;line-height:1;align-items:center;justify-content:center;cursor:pointer;padding:0}
.filter-clear-btn.show{display:flex}
.src-tabs{display:flex;gap:4px}
.src-tab{font-family:var(--mono);font-size:.65rem;padding:6px 10px;border:1px solid var(--rule);border-radius:20px;background:#fff;color:var(--ink3);cursor:pointer;white-space:nowrap;transition:all .15s}
.src-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.count-badge{font-family:var(--mono);font-size:.65rem;color:var(--ink3);white-space:nowrap;flex-shrink:0}

/* 세션 목록 */
.session-list{display:flex;flex-direction:column;gap:10px}
.session-card{background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden;transition:box-shadow .15s;scroll-margin-top:20px}
.session-card.planned{background:var(--plan-bg);border-color:var(--plan-border)}
.session-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 11px;cursor:pointer;user-select:none;gap:10px}
.session-head>div:first-child{min-width:0}
.session-card.open .session-head{border-bottom:1px solid var(--rule)}
.session-card.planned.open .session-head{border-bottom-color:var(--plan-border)}
.session-date{font-family:var(--mono);font-size:.85rem;font-weight:500;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-card.planned .session-date{color:var(--plan)}
.session-memo{font-size:.7rem;color:var(--ink3);margin-top:1px;line-height:1.4}
.session-memo-hint{margin-left:6px;font-size:.68rem;color:var(--ink3)}
.session-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.session-source{font-family:var(--mono);font-size:.6rem;padding:2px 7px;border-radius:10px;border:1px solid var(--rule);white-space:nowrap;flex-shrink:0}
.src-badge-session{background:#fff8ee;color:#8b4513;border-color:#ddd0b8}
.src-badge-personal{background:var(--accent-light);color:var(--accent);border-color:#c0dcc8}
.src-badge-planned{background:var(--plan-bg);color:var(--plan);border-color:var(--plan-border)}
.session-chevron{font-size:.65rem;color:var(--ink3);transition:transform .2s}
.session-card.open .session-chevron{transform:rotate(180deg)}

/* 세션 바디 */
.session-body{display:none;padding:10px 12px 12px}
.session-card.open .session-body{display:block}
.ex-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.ex-card{background:var(--bg);border-radius:8px;padding:9px 11px;display:flex;align-items:flex-start;gap:8px}
.session-card.planned .ex-card{background:#fff8cc}
.ex-num{font-family:var(--mono);font-size:.62rem;color:var(--ink3);width:14px;flex-shrink:0;padding-top:2px}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:.85rem;font-weight:500}
.ex-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ex-chip{font-family:var(--mono);font-size:.65rem;color:var(--ink2);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:1px 6px}
.ex-note{font-size:.85rem;color:var(--ink3);margin-top:3px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.session-memo-full{font-size:.75rem;color:var(--ink2);background:var(--bg);border-radius:8px;padding:9px 11px;margin-bottom:10px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.session-foot{display:flex;justify-content:flex-end;gap:6px;padding-top:8px;border-top:1px solid var(--rule)}

/* 폼 */
.form-card{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:20px 16px;margin-bottom:20px}
.unit-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.unit-bar-label{font-family:var(--mono);font-size:.62rem;letter-spacing:.05em;color:var(--ink3);text-transform:uppercase}
.unit-toggle{display:flex;border:1px solid var(--rule);border-radius:20px;overflow:hidden}
.unit-opt{font-family:var(--mono);font-size:.68rem;padding:4px 12px;border:none;background:#fff;color:var(--ink3);cursor:pointer}
.unit-opt.active{background:var(--accent);color:#fff}
.unit-bar-hint{font-size:.65rem;color:var(--ink3);flex-basis:100%;line-height:1.4}
.form-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--mono);font-size:.62rem;letter-spacing:.07em;color:var(--ink3);text-transform:uppercase}
.field input,.field select,.field textarea{font-family:var(--sans);font-size:.85rem;padding:9px 11px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink);outline:none;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:none;overflow:hidden;line-height:1.4;font-family:var(--sans)}
.f-date input{width:150px;font-family:var(--mono)}.f-memo{flex:1;min-width:140px}.f-src select{width:100px}
.ex-inputs{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.ex-input-card{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.ex-input-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ex-input-num{font-family:var(--mono);font-size:.65rem;color:var(--ink3);width:16px;flex-shrink:0}
.autocomplete-wrap{position:relative;flex:1}
.autocomplete-wrap input{width:100%;font-family:var(--sans);font-size:.85rem;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink);outline:none}
.autocomplete-wrap input:focus{border-color:var(--accent)}
.ac-dropdown{position:absolute;top:calc(100% + 3px);left:0;right:0;background:#fff;border:1px solid var(--rule);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:100;max-height:180px;overflow-y:auto;display:none}
.ac-dropdown.show{display:block}
.ac-item{padding:9px 12px;font-size:.83rem;cursor:pointer;border-bottom:1px solid var(--bg)}
.ac-item:last-child{border-bottom:none}
.ac-item:active{background:var(--accent-light);color:var(--accent)}
.ac-count{font-family:var(--mono);font-size:.62rem;color:var(--ink3);float:right}
.ex-input-field{display:flex;flex-direction:column;gap:3px}
.ex-input-field label{font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
.ex-input-field input,.ex-input-field textarea{font-family:var(--mono);font-size:.82rem;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink);outline:none;width:100%}
.ex-input-field input:focus,.ex-input-field textarea:focus{border-color:var(--accent)}
.ex-input-field textarea{resize:none;overflow:hidden;line-height:1.4;font-family:var(--sans);min-height:34px}
/* 무게·세트·횟수 세트행 (헤더와 동일 그리드로 정렬 보장) */
.set-header,.set-row{display:grid;grid-template-columns:1.2fr 0.8fr 0.8fr 0.8fr 26px;gap:5px;align-items:center}
.set-header{margin:8px 0 2px}
.set-header span{font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase;text-align:center}
.wt-unit-btn{font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase;background:none;border:none;padding:0;margin:0;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:3px}
.set-header .wt-unit-badge{font-size:.56rem;letter-spacing:0;text-transform:none;padding:1px 5px;border-radius:8px;background:var(--accent-light);color:var(--accent)}
.set-row{margin-top:6px}
.set-row input{font-family:var(--mono);font-size:.82rem;padding:8px 6px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink);outline:none;width:100%;text-align:center}
.set-row input:focus{border-color:var(--accent)}
.w-wrap{position:relative}
.w-wrap input{padding-right:22px}
.w-plus-btn{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:17px;height:17px;border:none;border-radius:50%;background:var(--accent-light);color:var(--accent);font-size:.72rem;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.w-plus-btn:active{background:var(--accent);color:#fff}
.set-del{font-size:.72rem;height:34px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--warn);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.set-del:active{background:#fbeaea;border-color:var(--warn)}
.add-set-btn{font-family:var(--mono);font-size:.66rem;color:var(--ink2);background:none;border:1px dashed var(--rule);border-radius:6px;padding:6px;cursor:pointer;width:100%;margin-top:7px}
.add-set-btn:active{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.ex-memo{margin-top:10px}
.ex-input-actions{display:flex;justify-content:flex-start;align-items:center;margin-top:10px}
.order-btns{display:flex;gap:4px}
.order-btn{font-size:.75rem;width:28px;height:28px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center}
.order-btn:active{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.add-ex-btn{font-family:var(--mono);font-size:.72rem;color:var(--accent);background:none;border:1px dashed var(--accent);border-radius:8px;padding:9px;cursor:pointer;width:100%;margin-bottom:14px;transition:background .15s}
.add-ex-btn:active{background:var(--accent-light)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:14px;border-top:1px solid var(--rule)}

/* 운동 동영상 (입력 폼) */
.ex-video-field{margin-top:10px;padding-top:10px;border-top:1px dashed var(--rule)}
.ex-video-tabs{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.ex-video-label{font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
.video-tab-btn{font-family:var(--mono);font-size:.65rem;padding:5px 10px;border:1px solid var(--rule);border-radius:20px;background:#fff;color:var(--ink3);cursor:pointer}
.video-tab-btn.active{background:var(--accent-light);color:var(--accent);border-color:#c0dcc8}
.video-remove-btn{margin-left:auto;font-family:var(--mono);font-size:.65rem;color:var(--warn);background:none;border:none;cursor:pointer;padding:4px 6px}
.video-yt-input{font-family:var(--sans);font-size:.85rem;padding:9px 11px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink);outline:none;width:100%}
.video-yt-input:focus{border-color:var(--accent)}
.video-file-input{font-family:var(--mono);font-size:.72rem;width:100%}
.video-preview-box{margin-top:6px}
.video-preview-box img,.video-preview-box video{display:block;width:100%;max-height:240px;object-fit:contain;background:#000;border-radius:8px}
.video-file-label{font-family:var(--mono);font-size:.65rem;color:var(--ink3);margin-top:4px;line-height:1.4}
.video-uploading,.video-missing{font-size:.68rem;color:var(--ink3);padding:8px;text-align:center;background:var(--bg);border-radius:6px}

/* 운동 동영상 (기록 조회) */
.ex-video-block{position:relative;margin-top:6px;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--bg);min-height:44px;display:flex;align-items:center;justify-content:center}
.ex-video-block img{display:block;width:100%}
.video-play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;pointer-events:none}
.ex-video-block-upload{padding:10px;justify-content:flex-start;gap:8px;background:var(--paper);border:1px solid var(--rule)}
.ex-video-block-upload .video-play-icon{position:static;transform:none;background:var(--accent);flex-shrink:0}
.video-file-name{font-size:.72rem;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-video-frame{margin-top:6px;border-radius:8px;overflow:hidden}
.ex-video-frame iframe{width:100%;height:200px;display:block;border:none}
.ex-video-frame video{width:100%;max-height:min(70vh,480px);display:block;object-fit:contain;background:#000}

/* 추이 */
.trend-controls{margin-bottom:20px}
.trend-controls select{font-family:var(--mono);font-size:.78rem;padding:9px 12px;border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);outline:none;width:100%;-webkit-appearance:none}
#trend-chart-wrap{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:20px 16px}
#trend-title{font-weight:500;margin-bottom:3px}
#trend-subtitle{font-family:var(--mono);font-size:.65rem;color:var(--ink3);margin-bottom:16px}
.trend-chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
svg#trend-svg{height:180px;display:block}
.trend-points-list{margin-top:16px;display:flex;flex-direction:column;gap:7px}
.tp-row{display:flex;align-items:center;gap:8px;font-size:.75rem}
.tp-date{font-family:var(--mono);color:var(--ink3);width:80px;flex-shrink:0;font-size:.68rem}
.tp-bar-wrap{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.tp-bar{height:100%;border-radius:3px;background:var(--accent)}
.tp-val{font-family:var(--mono);width:60px;text-align:right;font-size:.72rem;color:var(--accent);flex-shrink:0}
/* 주간 총 볼륨 목록 (날짜 범위를 온전히 보여주려고 날짜를 별도 줄에 표시) */
.tp-row-vol{margin-bottom:2px}
.tp-vol-date{font-family:var(--mono);font-size:.68rem;color:var(--ink3);margin-bottom:4px}
.tp-vol-bar-line{display:flex;align-items:center;gap:8px}
.tp-note{color:var(--ink3);font-size:.65rem;flex:1}

/* 토스트 */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;font-family:var(--mono);font-size:.72rem;padding:9px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:all .2s;z-index:999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 빈 상태 */
.empty{text-align:center;padding:50px 0;color:var(--ink3);font-size:.83rem}
.empty-icon{font-size:1.8rem;margin-bottom:10px}

/* 모달 */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center}
#modal-overlay.show{display:flex}
#modal{background:var(--paper);border-radius:16px 16px 0 0;padding:24px 16px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto}
#modal h2{font-size:1rem;font-weight:600;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
</style>
</head>
<body>
<div class="shell">
  <header class="app-header">
    <div class="app-title"><span>WORKOUT LOG</span>운동일지</div>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" id="sync-btn" onclick="openSyncSettings()" title="Google 시트 클라우드 동기화" aria-label="클라우드 동기화">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
        <span id="sync-check">✓</span>
      </button>
      <button class="btn btn-ghost btn-sm" onclick="importJSON()" title="JSON 파일에서 불러오기">불러오기</button>
      <button class="btn btn-ghost btn-sm" onclick="exportCSV()">CSV</button>
      <button class="btn btn-ghost btn-sm" onclick="exportJSON()">JSON</button>
    </div>
    <input type="file" id="json-file-input" accept=".json,application/json" style="display:none" onchange="handleJSONFile(event)">
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('log')">기록 조회</button>
    <button class="tab" onclick="switchTab('add')">새 세션</button>
    <button class="tab" onclick="switchTab('trend')">추이 분석</button>
  </div>

  <!-- 기록 조회 -->
  <div class="panel active" id="panel-log">
    <div class="filter-bar">
      <div class="filter-input-wrap">
        <input type="text" id="filter-ex" placeholder="운동명 검색…">
        <button type="button" class="filter-clear-btn" id="filter-clear-btn" onclick="clearFilter()" aria-label="검색어 지우기">✕</button>
      </div>
      <span class="count-badge" id="session-count"></span>
    </div>
    <div class="src-tabs" style="margin-bottom:14px">
      <button class="src-tab active" data-src="" onclick="setSrcFilter(this)">전체</button>
      <button class="src-tab" data-src="personal" onclick="setSrcFilter(this)">개인일지</button>
      <button class="src-tab" data-src="session" onclick="setSrcFilter(this)">세션지</button>
      <button class="src-tab" data-src="planned" onclick="setSrcFilter(this)">예정</button>
    </div>
    <div class="session-list" id="session-list"></div>
  </div>

  <!-- 새 세션 -->
  <div class="panel" id="panel-add">
    <div class="form-card">
      <div class="form-row">

<script>
// ══════════════════════════════════
// 데이터
// ══════════════════════════════════
// 데이터는 JSON 불러오기 또는 클라우드 저장소에서 관리됩니다.
// 코드에는 초기 데이터를 두지 않아, 인터페이스 수정이 데이터에 영향을 주지 않습니다.
const SEED = [];

// ══════════════════════════════════
// 상태
// ══════════════════════════════════
let DB = [];
let currentSrcFilter = '';
let rowCount = 0;
let editingId = null;
let dbDirty = false; // 페이지 로드 후 사용자가 데이터를 수정했는지 (백그라운드 동기화가 덮어쓰지 않게)
const PENDING_PUSH_KEY = 'workout_pending_push'; // 클라우드로 아직 못 올린 변경이 있는지
const STORAGE_KEY = 'workout_db';
const CLOUD_URL_KEY = 'workout_cloud_url'; // Apps Script 웹앱 URL (기기별 localStorage, 코드/저장소엔 미포함)

// ── 운동 데이터 정규화 ──
// exercise = { name, note, rows:[{weight,sets,reps,rir}] }
// 예전 형식 { name, weight, sets, reps, note }(단일)도 자동 변환해 호환합니다.
function exRows(e){
  if(!e) return [];
  if(Array.isArray(e.rows)) return e.rows;
  if(e.weight||e.sets||e.reps) return [{weight:e.weight||'',sets:e.sets||'',reps:e.reps||'',rir:e.rir||''}];
  return [];
}
// 단위가 없는 과거 데이터는 항상 kg로 표시돼왔으므로, 마이그레이션 시 kg로 명시 확정합니다.
// (새로 입력되는 값은 저장 시점(getExRowData)에 이미 단위가 찍혀서 들어오므로 여기선 건드리지 않음)
function stampLegacyWeight(w){
  if(!w) return w;
  return weightHasUnit(w) ? w : (w+'kg');
}
// 동영상 필드: {type:'youtube',url} 또는 {type:'upload',videoId,name} 만 유효. 그 외엔 버림(방어적 정규화).
function normalizeVideo(v){
  if(!v || typeof v!=='object') return null;
  if(v.type==='youtube' && v.url) return { type:'youtube', url:String(v.url) };
  if(v.type==='upload' && v.videoId) return { type:'upload', videoId:String(v.videoId), name:v.name?String(v.name):'' };
  return null;
}
function normalizeExercise(e){
  if(!e || typeof e!=='object') return {name:'',note:'',rows:[],video:null};
  let rows;
  if(Array.isArray(e.rows)){
    rows = e.rows.map(r=>({ weight:stampLegacyWeight(String(r.weight??'')), sets:String(r.sets??''), reps:String(r.reps??''), rir:String(r.rir??'') }));
  } else if(e.weight||e.sets||e.reps){
    rows = [{ weight:stampLegacyWeight(String(e.weight||'')), sets:String(e.sets||''), reps:String(e.reps||''), rir:String(e.rir||'') }];
  } else {
    rows = [];
  }
  return { name:e.name||'', note:e.note||'', rows, video:normalizeVideo(e.video) };
}
function normalizeDB(){
  DB.forEach(s=>{ if(Array.isArray(s.exercises)) s.exercises = s.exercises.map(normalizeExercise); });
}
// 한 운동에서 가장 무거운 세트의 무게(kg 환산) — 추이 분석용
function exMaxWeight(e){
  let max=null;
  exRows(e).forEach(r=>{ const n=weightToKg(r.weight); if(n!==null && (max===null||n>max)) max=n; });
  return max;
}

// ── 클라우드(Google 시트) 연동 ──
function getCloudUrl(){ return (localStorage.getItem(CLOUD_URL_KEY) || '').trim(); }

// 무응답 방지용 타임아웃 fetch (기본 15초)
function fetchWithTimeout(url, opts, ms){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms||15000);
  return fetch(url, Object.assign({}, opts, { signal: ctrl.signal }))
    .finally(()=>clearTimeout(t));
}

// 지정 URL에서 전체 데이터 배열을 읽어옴
async function cloudLoad(url){
  url = url || getCloudUrl();
  if(!url) return null;
  const res = await fetchWithTimeout(url + (url.includes('?') ? '&' : '?') + 'action=load', { method:'GET', redirect:'follow' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if(!json || !Array.isArray(json.data)) throw new Error('형식 오류');
  return json.data;
}

// 전체 데이터 배열을 클라우드에 저장 (text/plain으로 CORS preflight 회피)
async function cloudSave(data, url){
  url = url || getCloudUrl();
  if(!url) return false;
  const res = await fetchWithTimeout(url, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action:'save', data: data }),
    redirect:'follow'
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return true;
}

// 헤더 ☁ 버튼에 연결 상태 표시
function updateSyncBtn(){
  const b = document.getElementById('sync-btn');
  if(!b) return;
  const on = !!getCloudUrl();
  b.classList.toggle('synced', on);
  b.title = on ? 'Google 시트 동기화: 연결됨' : 'Google 시트 클라우드 동기화 설정';
}

// 로컬 캐시에서 즉시 불러오기 (네트워크 없음). 캐시 존재 여부 반환.
function loadLocal(){
  try {
    const value = localStorage.getItem(STORAGE_KEY);
    if(value){
      DB = JSON.parse(value);
      normalizeDB();
      return true;
    }
  } catch(e) {
    // 키가 없거나 손상 → 빈 상태
  }
  DB = JSON.parse(JSON.stringify(SEED)); // SEED는 빈 배열
  return false;
}

// 백그라운드 클라우드 동기화 (로컬을 먼저 그린 뒤 호출). UI를 막지 않음.
async function backgroundSync(){
  const url = getCloudUrl();
  if(!url) return;
  // 아직 클라우드로 못 올린 로컬 변경이 있으면(오프라인 저장 등) → 밀어올리기 우선(덮어쓰기 방지)
  if(localStorage.getItem(PENDING_PUSH_KEY)==='1'){
    try { await cloudSave(DB); localStorage.removeItem(PENDING_PUSH_KEY); } catch(e){}
    return;
  }
  // 그 외엔 클라우드 최신본을 받아 반영
  dbDirty = false;
  try {
    const data = await cloudLoad(url);
    if(data && !dbDirty){ // 동기화 도중 사용자가 저장했으면 덮어쓰지 않음
      DB = data;
      normalizeDB();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch(e){}
      renderLog();
      if(document.getElementById('panel-trend')?.classList.contains('active')) populateTrendSelect();
    }
  } catch(e){
    // 로컬 데이터가 이미 표시됨 → 조용히 무시
  }
}

// 저장: 로컬 캐시(즉시) + 클라우드(백그라운드 — UI를 막지 않음)
function saveDB(){
  dbDirty = true;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  } catch(e){
    toast('⚠ 저장 중 오류');
  }
  if(getCloudUrl()){
    localStorage.setItem(PENDING_PUSH_KEY,'1');
    cloudSave(DB)
      .then(()=>localStorage.removeItem(PENDING_PUSH_KEY))
      .catch(()=>toast('⚠ 클라우드 저장 실패 (로컬엔 저장됨)'));
  }
}

// ── JSON 불러오기 ──
function importJSON(){
  document.getElementById('json-file-input').click();
}

async function handleJSONFile(event){
  const file = event.target.files[0];
  if(!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if(!Array.isArray(data)) throw new Error('배열 형식이 아님');

    // 간단한 유효성 검사: 각 항목에 id/date/exercises 가 있는지
    const valid = data.every(s => s && s.date && Array.isArray(s.exercises));
    if(!valid) throw new Error('세션 형식 오류');

    // id 없는 항목엔 자동 부여
    data.forEach(s => { if(!s.id) s.id = uid(); });

    const mode = DB.length>0
      ? prompt(`현재 ${DB.length}개 세션이 있습니다.\n불러온 ${data.length}개를…\n\n[확인]=교체 / [취소]=추가(병합)`, '교체')
      : '교체';

    if(mode===null){
      // 취소 → 병합 (중복 id는 불러온 것으로 덮어씀)
      const map = {};
      DB.forEach(s=>map[s.id]=s);
      data.forEach(s=>map[s.id]=s);
      DB = Object.values(map);
      toast(`✓ 병합 완료 (총 ${DB.length}개)`);
    } else {
      // 교체
      DB = data;
      toast(`✓ ${data.length}개 세션 불러옴`);
    }
    normalizeDB();
    await saveDB();
    renderLog();
  } catch(e){
    alert('불러오기 실패: '+e.message);
  } finally {
    event.target.value=''; // 같은 파일 재선택 가능하게 초기화
  }
}

// ══════════════════════════════════
// 유틸
// ══════════════════════════════════
function uid(){ return 'u'+Date.now()+Math.random().toString(36).slice(2,5); }
// Date 객체를 이 기기의 로컬 날짜 기준 YYYY-MM-DD로 변환.
// toISOString()은 UTC로 변환하므로 한국(UTC+9) 등에서 자정 근처에 하루 밀려 보이는 버그가 생김 — 반드시 이걸 씀.
function localDateStr(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}
function extractLastNum(str){
  if(!str) return null;
  const parts=String(str).split(/[→\-]/);
  for(let i=parts.length-1;i>=0;i--){
    const seg=parts[i];
    if(seg.includes('+')){
      // 원판 합산 표기 지원: "20+2.5+2.5kg" → 25
      const sum=seg.split('+').reduce((acc,tok)=>{
        const n=parseFloat(tok.replace(/[^0-9.]/g,''));
        return isNaN(n)?acc:acc+n;
      },0);
      if(sum>0) return sum;
      continue;
    }
    const n=parseFloat(seg.replace(/[^0-9.]/g,''));
    if(!isNaN(n)&&n>0) return n;
  }
  return null;
}

// ── 무게 단위 (kg/lbs 혼용 지원) ──
const UNIT_KEY = 'workout_unit'; // 기본 단위(기기별 설정)
const LB_TO_KG = 0.45359237;
function getUnit(){ return localStorage.getItem(UNIT_KEY)==='lbs' ? 'lbs' : 'kg'; }
// 무게 문자열에 단위가 이미 적혀 있는지
function weightHasUnit(str){ return /kg|lb|파운드|킬로|키로/i.test(String(str)); }
// 이 무게 값의 단위 (적혀 있으면 그것, 없으면 기본 단위)
function weightUnit(str){
  const s=String(str);
  if(/lb|파운드/i.test(s)) return 'lbs';
  if(/kg|킬로|키로/i.test(s)) return 'kg';
  return getUnit();
}
// 화면 표시용: 단위가 없으면 기본 단위를 붙이고, 숫자와 단위 사이에 공백을 넣어 가독성을 높임
// (저장되는 원본 값은 공백 없이 유지 — 이건 표시 전용 가공)
function displayWeight(w){
  if(!w) return '';
  const withUnit = weightHasUnit(w) ? String(w) : (String(w)+getUnit());
  return withUnit.replace(/(\d)(kg|lbs?|파운드|킬로|키로)$/i, '$1 $2');
}
// 비교·추이용: kg 숫자로 환산 (lbs면 변환)
function weightToKg(str){
  const n=extractLastNum(str);
  if(n===null) return null;
  return weightUnit(str)==='lbs' ? n*LB_TO_KG : n;
}
function setDefaultUnit(u){
  localStorage.setItem(UNIT_KEY, u==='lbs'?'lbs':'kg');
  updateUnitToggle();
  renderLog();
  if(document.getElementById('panel-trend')?.classList.contains('active')) renderTrend();
}
function updateUnitToggle(){
  const cur=getUnit();
  document.querySelectorAll('.unit-opt').forEach(b=>b.classList.toggle('active', b.dataset.unit===cur));
}
// ── 운동 동영상 (유튜브 링크 + 기기 로컬 업로드) ──
// 다양한 유튜브 링크 형식에서 11자리 영상 ID 추출
function extractYoutubeId(url){
  if(!url) return null;
  const m = String(url).match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}
// 업로드 동영상 원본 파일은 용량이 커서 localStorage/클라우드 시트에 못 들어가므로,
// 이 기기의 IndexedDB에만 저장(videoId로 참조). 다른 기기로는 동기화되지 않음.
// 썸네일도 같은 이유로 동기화 데이터(JSON)엔 절대 넣지 않고 별도 store에 videoId로 같이 저장한다 —
// 클라우드 동기화는 DB 전체를 시트 셀 하나(5만자 한도)에 JSON으로 밀어넣는 구조라, 이미지 데이터가 섞이면
// 동기화 전체가 깨질 수 있기 때문.
const VIDEO_DB_NAME='workout_videos', VIDEO_STORE='videos', THUMB_STORE='thumbs';
function openVideoDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(VIDEO_DB_NAME,2);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(VIDEO_STORE)) db.createObjectStore(VIDEO_STORE);
      if(!db.objectStoreNames.contains(THUMB_STORE)) db.createObjectStore(THUMB_STORE);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function videoDBPutInto(store, id, blob){
  return openVideoDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readwrite');
    tx.objectStore(store).put(blob, id);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  }));
}
function videoDBGetFrom(store, id){
  return openVideoDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).get(id);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  }));
}
function videoDBPut(id, blob){ return videoDBPutInto(VIDEO_STORE, id, blob); }
function videoDBGet(id){ return videoDBGetFrom(VIDEO_STORE, id); }
function thumbDBPut(id, blob){ return videoDBPutInto(THUMB_STORE, id, blob); }
function thumbDBGet(id){ return videoDBGetFrom(THUMB_STORE, id); }

// 업로드된 동영상 파일에서 미리보기용 프레임을 한 장 캡처해 작은 JPEG Blob으로 반환 (실패 시 null)
function generateVideoThumbnail(file){
  return new Promise(resolve=>{
    let done=false;
    const finish=v=>{ if(done) return; done=true; clearTimeout(timer); resolve(v); };
    const video=document.createElement('video');
    video.preload='metadata'; video.muted=true; video.playsInline=true;
    const url=URL.createObjectURL(file);
    video.src=url;
    const cleanup=()=>URL.revokeObjectURL(url);
    video.addEventListener('loadedmetadata', ()=>{
      try{ video.currentTime = Math.min(1, (video.duration||2)/4) || 0; }
      catch(e){ cleanup(); finish(null); }
    });
    video.addEventListener('seeked', ()=>{
      try{
        const maxW=320;
        const vw=video.videoWidth||maxW, vh=video.videoHeight||180;
        const scale=Math.min(1, maxW/vw);
        const w=Math.max(1,Math.round(vw*scale)), h=Math.max(1,Math.round(vh*scale));
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(video,0,0,w,h);
        canvas.toBlob(blob=>{ cleanup(); finish(blob); }, 'image/jpeg', 0.72);
      } catch(e){ cleanup(); finish(null); }
    });
    video.addEventListener('error', ()=>{ cleanup(); finish(null); });
    const timer=setTimeout(()=>{ cleanup(); finish(null); }, 8000);
  });
}
function getExerciseNames(){
  const counts={};
  DB.forEach(s=>s.exercises.forEach(e=>{
    if(e.name&&e.name!=='???') counts[e.name]=(counts[e.name]||0)+1;
  }));
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([name,count])=>({name,count}));
}

// 탭
// ══════════════════════════════════
function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',['log','add','trend'][i]===name);
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  if(name==='trend') populateTrendSelect();
}

// ══════════════════════════════════
// 필터
// ══════════════════════════════════
function setSrcFilter(btn){
  currentSrcFilter = btn.dataset.src;
  document.querySelectorAll('.src-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderLog();
}
// 검색어 지우기 버튼: 입력값이 있을 때만 보이고, 누르면 검색어를 비움
function updateFilterClearBtn(){
  const input=document.getElementById('filter-ex');
  const btn=document.getElementById('filter-clear-btn');
  if(btn) btn.classList.toggle('show', !!input.value);
}
function clearFilter(){
  const input=document.getElementById('filter-ex');
  input.value='';
  updateFilterClearBtn();
  renderLog();
  input.focus();
}

function renderLog(){
  const q = document.getElementById('filter-ex').value.trim().toLowerCase();
  let sessions = [...DB].sort((a,b)=>b.date.localeCompare(a.date));
  if(currentSrcFilter) sessions = sessions.filter(s=>s.src===currentSrcFilter);
  if(q) sessions = sessions.filter(s=>s.exercises.some(e=>e.name.toLowerCase().includes(q)));

  document.getElementById('session-count').textContent = sessions.length+'개';
  const list = document.getElementById('session-list');

  if(!sessions.length){
    const isEmpty = DB.length===0;
    if(isEmpty){
      list.innerHTML=`<div class="empty"><div class="empty-icon">📂</div>데이터가 없습니다.<br><br>
        <button class="btn btn-primary" onclick="importJSON()" style="margin-top:4px">JSON 불러오기</button>
        <div style="margin-top:10px;font-size:.7rem">또는 '새 세션' 탭에서 직접 추가하세요.</div></div>`;
    } else {
      list.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div>조건에 맞는 세션이 없습니다.</div>`;
    }
    return;
  }

  list.innerHTML = sessions.map(s=>{
    const isPlanned = s.src==='planned';
    const badgeCls = s.src==='session'?'src-badge-session':s.src==='planned'?'src-badge-planned':'src-badge-personal';
    const badgeTxt = s.src==='session'?'세션지':s.src==='planned'?'예정':'개인일지';
    const preview = [...new Set(s.exercises.map(e=>e.name))].join(', ');
    // 헤더엔 첫 줄만 짧게 미리보기 (전체 메모는 펼쳤을 때 아래 본문에 표시)
    const memoFirstLine = s.memo ? escHtml(s.memo.split('\n')[0]) : '';
    const memoHtml = memoFirstLine?`<span class="session-memo-hint">${memoFirstLine}</span>`:'';
    const sessionMemoBlock = s.memo ? `<div class="session-memo-full">${escHtml(s.memo)}</div>` : '';

    const exCards = s.exercises.map((e,i)=>{
      const rowsHtml = exRows(e).map(r=>{
        const chips=[];
        if(r.weight) chips.push(`<span class="ex-chip">${displayWeight(r.weight)}</span>`);
        if(r.sets)   chips.push(`<span class="ex-chip">${r.sets}세트</span>`);
        if(r.reps)   chips.push(`<span class="ex-chip">${r.reps}회</span>`);
        if(r.rir)    chips.push(`<span class="ex-chip">RIR ${escHtml(r.rir)}</span>`);
        return chips.length?`<div class="ex-chips">${chips.join('')}</div>`:'';
      }).join('');
      return `<div class="ex-card">
        <span class="ex-num">${i+1}</span>
        <div class="ex-info">
          <div class="ex-name">${escHtml(e.name)}</div>
          ${rowsHtml}
          ${e.note?`<div class="ex-note">${escHtml(e.note)}</div>`:''}
          ${videoBlockHtml(e.video)}
        </div>
      </div>`;
    }).join('');

    const convertBtn = isPlanned
      ? `<button class="btn btn-convert" onclick="convertPlanned('${s.id}')">✓ 완료</button>`
      : '';

    return `<div class="session-card${isPlanned?' planned':''}" id="card-${s.id}">
      <div class="session-head" onclick="toggleCard('${s.id}')">
        <div>
          <div class="session-date">${s.date}${memoHtml}</div>
          <div class="session-memo">${preview}</div>
        </div>
        <div class="session-meta">
          <span class="session-source ${badgeCls}">${badgeTxt}</span>
          <span class="session-chevron">▼</span>
        </div>
      </div>
      <div class="session-body">
        ${sessionMemoBlock}
        <div class="ex-list">${exCards}</div>
        <div class="session-foot">
          <button class="btn btn-ghost btn-sm" onclick="copySessionToNew('${s.id}')">복사</button>
          <button class="btn btn-danger" onclick="deleteSession('${s.id}')">삭제</button>
          ${convertBtn}
          <button class="btn btn-ghost btn-sm" onclick="openEdit('${s.id}')">편집</button>
        </div>
      </div>
    </div>`;
  }).join('');
  hydrateUploadThumbs();
}

function toggleCard(id){
  document.getElementById('card-'+id).classList.toggle('open');
}
let pendingDelete=null;
async function deleteSession(id){
  if(pendingDelete===id){
    // 두 번째 클릭 → 실제 삭제
    DB=DB.filter(s=>s.id!==id);
    pendingDelete=null;
    await saveDB();
    renderLog();
    toast('삭제되었습니다.');
    return;
  }
  // 첫 클릭 → 확인 대기
  pendingDelete=id;
  const btn=document.querySelector(`#card-${id} .btn-danger`);
  if(btn){ btn.textContent='한번더!'; btn.style.fontWeight='700'; }
  toast('다시 누르면 삭제됩니다.');
  // 4초 내 재클릭 없으면 취소
  setTimeout(()=>{
    if(pendingDelete===id){
      pendingDelete=null;
      const b=document.querySelector(`#card-${id} .btn-danger`);
      if(b){ b.textContent='삭제'; b.style.fontWeight=''; }
    }
  },4000);
}
async function convertPlanned(id){
  const s=DB.find(x=>x.id===id);
  if(!s) return;
  s.src='personal';
  await saveDB();
  renderLog();
  toast('✓ 개인일지로 전환됐어요.');
}
// 그날의 운동 전체를 '새 세션' 입력 폼에 복사해 넣음 (날짜는 오늘로, 메모는 비움 — 원본은 그대로 유지)
function copySessionToNew(id){
  const s=DB.find(x=>x.id===id);
  if(!s) return;
  switchTab('add');
  document.getElementById('in-date').value=localDateStr(new Date());
  const memoEl=document.getElementById('in-memo');
  memoEl.value=''; memoEl.style.height='';
  document.getElementById('in-src').value=s.src||'personal';
  const wrap=document.getElementById('ex-inputs');
  wrap.innerHTML=''; rowCount=0;
  const cloned=JSON.parse(JSON.stringify(s.exercises||[]));
  if(cloned.length) cloned.forEach(e=>addExRow(e, wrap));
  else addExRow();
  toast('✓ 이 날의 운동을 새 세션에 복사했어요. 날짜를 확인하고 저장하세요.');
  window.scrollTo({top:0, behavior:'smooth'});
}

// ══════════════════════════════════
// 새 세션 입력
// ══════════════════════════════════
function escAttr(v){ return String(v==null?'':v).replace(/"/g,'&quot;'); }
// HTML 텍스트로 안전하게 표시(자유입력 필드용). 줄바꿈은 CSS white-space:pre-wrap이 그대로 살립니다.
function escHtml(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 메모 textarea 자동 높이 조절
function autoGrow(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }

// 기록 조회 화면의 동영상 썸네일(클릭 전엔 로드하지 않음 — 세션이 많아도 가벼움)
function videoBlockHtml(video){
  if(!video || !video.type) return '';
  if(video.type==='youtube' && video.url){
    const yid=extractYoutubeId(video.url);
    if(!yid) return '';
    return `<div class="ex-video-block" data-vtype="youtube" data-vref="${escAttr(video.url)}" onclick="playExerciseVideo(this)">
      <img src="https://img.youtube.com/vi/${yid}/mqdefault.jpg" alt="">
      <span class="video-play-icon">▶</span>
    </div>`;
  }
  if(video.type==='upload' && video.videoId){
    return `<div class="ex-video-block ex-video-block-upload" data-vtype="upload" data-vref="${escAttr(video.videoId)}" onclick="playExerciseVideo(this)">
      <span class="video-play-icon">▶</span><span class="video-file-name">${escHtml(video.name||'업로드된 영상')}</span>
    </div>`;
  }
  return '';
}
// 업로드 동영상은 목록 HTML엔 파일명 라벨만 먼저 넣어두고(동기 렌더),
// 이 기기의 IndexedDB에 썸네일이 있으면 비동기로 불러와 이미지로 바꿔치기한다.
function hydrateUploadThumbs(){
  document.querySelectorAll('.ex-video-block-upload[data-vtype="upload"]').forEach(el=>{
    const id=el.dataset.vref;
    if(!id) return;
    thumbDBGet(id).then(blob=>{
      if(!blob || !el.isConnected) return;
      el.classList.remove('ex-video-block-upload');
      el.innerHTML = `<img src="${URL.createObjectURL(blob)}" alt=""><span class="video-play-icon">▶</span>`;
    }).catch(()=>{});
  });
}
// 썸네일 클릭 시 실제 재생 요소로 교체 (유튜브: iframe embed / 업로드: IndexedDB에서 blob 조회)
function playExerciseVideo(el){
  const type=el.dataset.vtype, ref=el.dataset.vref;
  if(type==='youtube'){
    const yid=extractYoutubeId(ref);
    if(!yid) return;
    el.outerHTML = `<div class="ex-video-frame"><iframe src="https://www.youtube-nocookie.com/embed/${yid}?autoplay=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen frameborder="0"></iframe></div>`;
  } else if(type==='upload'){
    el.innerHTML = '<span class="video-play-icon" style="position:static;transform:none">⏳</span>';
    videoDBGet(ref).then(blob=>{
      if(!blob){ el.outerHTML='<div class="ex-video-block video-missing">⚠ 이 영상은 다른 기기에서 업로드돼 여기서는 재생할 수 없어요.</div>'; return; }
      const url=URL.createObjectURL(blob);
      el.outerHTML = `<div class="ex-video-frame"><video controls autoplay src="${url}"></video></div>`;
    }).catch(()=>{ el.outerHTML='<div class="ex-video-block video-missing">⚠ 재생 실패</div>'; });
  }
}

// 이 운동의 초기 무게 단위 추정: 기존 데이터에 단위가 찍힌 값이 있으면 그걸, 없으면 전역 기본 단위를 씀
function inferExUnit(d){
  const rows=exRows(d);
  for(const r of rows){ if(r.weight && weightHasUnit(r.weight)) return weightUnit(r.weight); }
  return getUnit();
}
function addExRow(data, container){
  rowCount++;
  const n=rowCount, d=data||{};
  const wrap=container||document.getElementById('ex-inputs');
  const div=document.createElement('div');
  div.className='ex-input-card'; div.id='exrow-'+n;
  const initUnit=inferExUnit(d);
  div.dataset.exUnit=initUnit;
  div.innerHTML=`
    <div class="ex-input-top">
      <span class="ex-input-num">${wrap.children.length+1}</span>
      <div class="autocomplete-wrap">
        <input type="text" placeholder="운동명" value="${escAttr(d.name)}"
          oninput="onAcInput(this,${n})" onblur="hideAc(${n})" autocomplete="off">
        <div class="ac-dropdown" id="ac-${n}"></div>
      </div>
      <button type="button" class="btn btn-danger" onclick="removeExRow(${n})">✕</button>
    </div>
    <div class="set-header">
      <button type="button" class="wt-unit-btn" onclick="toggleExUnit(${n})" title="탭하여 이 운동만 단위 전환">무게<span class="wt-unit-badge">${initUnit}</span></button>
      <span>세트</span><span>횟수</span><span>RIR</span><span></span>
    </div>
    <div class="set-rows" id="setrows-${n}"></div>
    <button type="button" class="add-set-btn" onclick="addSetRow(${n})">＋ 세트 행</button>
    <div class="ex-input-field ex-memo">
      <label>메모</label>
      <textarea placeholder="예: 한쪽, 보조" rows="1" oninput="autoGrow(this)">${escHtml(d.note)}</textarea>
    </div>
    <div class="ex-video-field" id="video-field-${n}">
      <div class="ex-video-tabs">
        <span class="ex-video-label">동영상</span>
        <button type="button" class="video-tab-btn active" data-type="youtube" onclick="setVideoTab(${n},'youtube')">유튜브</button>
        <button type="button" class="video-tab-btn" data-type="upload" onclick="setVideoTab(${n},'upload')">업로드</button>
        <button type="button" class="video-remove-btn" onclick="clearExVideo(${n})">제거</button>
      </div>
      <input type="url" class="video-yt-input" placeholder="https://youtube.com/watch?v=…" oninput="onVideoYtInput(${n})">
      <input type="file" class="video-file-input" accept="video/*" style="display:none" onchange="onVideoFileInput(${n},event)">
      <div class="video-preview-box" id="video-preview-${n}"></div>
    </div>
    <div class="ex-input-actions">
      <div class="order-btns">
        <button type="button" class="order-btn" onclick="moveRow(${n},-1)">↑</button>
        <button type="button" class="order-btn" onclick="moveRow(${n},1)">↓</button>
      </div>
    </div>`;
  wrap.appendChild(div);
  const rows=exRows(d);
  if(rows.length) rows.forEach(r=>addSetRow(n,r));
  else addSetRow(n,{});
  if(d.video) hydrateVideoField(n, d.video);
  renumberRows(wrap);
}

// 동영상 입력 탭 전환(유튜브 링크 ↔ 파일 업로드) — 표시만 전환, 실제 값은 각 입력 이벤트에서 확정
function setVideoTab(n, type){
  const card=document.getElementById('exrow-'+n);
  if(!card) return;
  card.querySelectorAll('.video-tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.type===type));
  const yt=card.querySelector('.video-yt-input'), up=card.querySelector('.video-file-input');
  if(yt) yt.style.display = type==='youtube' ? '' : 'none';
  if(up) up.style.display = type==='upload' ? '' : 'none';
}
// 편집 시 기존 동영상 값으로 입력 필드/미리보기 채우기
function hydrateVideoField(n, video){
  const card=document.getElementById('exrow-'+n);
  const preview=document.getElementById('video-preview-'+n);
  if(!card || !video) return;
  if(video.type==='youtube' && video.url){
    card.dataset.videoType='youtube'; card.dataset.videoUrl=video.url;
    const yt=card.querySelector('.video-yt-input'); if(yt) yt.value=video.url;
    setVideoTab(n,'youtube');
    const yid=extractYoutubeId(video.url);
    if(preview) preview.innerHTML = yid ? `<img src="https://img.youtube.com/vi/${yid}/mqdefault.jpg" alt="">` : '';
  } else if(video.type==='upload' && video.videoId){
    card.dataset.videoType='upload'; card.dataset.videoId=video.videoId; card.dataset.videoName=video.name||'';
    setVideoTab(n,'upload');
    if(preview){
      preview.innerHTML = `<div class="video-file-label">📁 ${escHtml(video.name||'업로드된 영상')} (이 기기에 저장됨 — 바꾸려면 새 파일을 선택하세요)</div>`;
      thumbDBGet(video.videoId).then(blob=>{
        if(!blob || !preview.isConnected) return;
        const img=document.createElement('img');
        img.src=URL.createObjectURL(blob); img.alt='';
        img.style.cssText='border-radius:8px;max-height:160px;width:100%;object-fit:contain;background:#000;margin-bottom:4px';
        preview.prepend(img);
      }).catch(()=>{});
    }
  }
}
// 유튜브 링크 입력 처리
function onVideoYtInput(n){
  const card=document.getElementById('exrow-'+n);
  if(!card) return;
  const input=card.querySelector('.video-yt-input');
  const url=input.value.trim();
  const preview=document.getElementById('video-preview-'+n);
  if(!url){
    delete card.dataset.videoType; delete card.dataset.videoUrl;
    if(preview) preview.innerHTML='';
    return;
  }
  const yid=extractYoutubeId(url);
  if(!yid){
    delete card.dataset.videoType; delete card.dataset.videoUrl;
    if(preview) preview.innerHTML='<div class="video-missing">올바른 유튜브 링크가 아니에요.</div>';
    return;
  }
  card.dataset.videoType='youtube'; card.dataset.videoUrl=url;
  delete card.dataset.videoId; delete card.dataset.videoName;
  if(preview) preview.innerHTML = `<img src="https://img.youtube.com/vi/${yid}/mqdefault.jpg" alt="">`;
}
// 파일 업로드 처리: 이 기기의 IndexedDB에 저장하고 videoId만 세션 데이터에 남김
async function onVideoFileInput(n, event){
  const file=event.target.files[0];
  const card=document.getElementById('exrow-'+n);
  const preview=document.getElementById('video-preview-'+n);
  if(!file || !card) return;
  if(file.size > 200*1024*1024){
    alert('영상 파일이 너무 큽니다(200MB 이하 권장). 유튜브에 올린 뒤 링크를 사용하는 걸 추천해요.');
    event.target.value='';
    return;
  }
  if(preview) preview.innerHTML='<div class="video-uploading">저장 중…</div>';
  try {
    const videoId=uid();
    const [, thumbBlob] = await Promise.all([
      videoDBPut(videoId, file),
      generateVideoThumbnail(file).catch(()=>null)
    ]);
    if(thumbBlob) thumbDBPut(videoId, thumbBlob).catch(()=>{});
    card.dataset.videoType='upload'; card.dataset.videoId=videoId; card.dataset.videoName=file.name;
    delete card.dataset.videoUrl;
    const objUrl=URL.createObjectURL(file);
    if(preview) preview.innerHTML = `<video controls src="${objUrl}"></video><div class="video-file-label">📁 ${escHtml(file.name)} — 이 기기에만 저장돼요.</div>`;
  } catch(e){
    if(preview) preview.innerHTML='<div class="video-missing">저장 실패: 다시 시도해주세요.</div>';
  }
}
function clearExVideo(n){
  const card=document.getElementById('exrow-'+n);
  if(!card) return;
  delete card.dataset.videoType; delete card.dataset.videoUrl; delete card.dataset.videoId; delete card.dataset.videoName;
  const yt=card.querySelector('.video-yt-input'), up=card.querySelector('.video-file-input');
  if(yt) yt.value='';
  if(up) up.value='';
  const preview=document.getElementById('video-preview-'+n);
  if(preview) preview.innerHTML='';
}
// 운동 카드별 무게 단위 전환(탭할 때마다 kg↔lbs). 이 운동의 세트 중 단위를 직접 안 적은 값에만 적용됨.
function toggleExUnit(n){
  const card=document.getElementById('exrow-'+n);
  if(!card) return;
  const next = card.dataset.exUnit==='lbs' ? 'kg' : 'lbs';
  card.dataset.exUnit=next;
  const badge=card.querySelector('.wt-unit-badge');
  if(badge) badge.textContent=next;
}

// 무게·세트·횟수·RIR 한 행 추가
function addSetRow(exN, d){
  d=d||{};
  const cont=document.getElementById('setrows-'+exN);
  if(!cont) return;
  const div=document.createElement('div');
  div.className='set-row';
  div.innerHTML=`
    <div class="w-wrap">
      <input class="w" placeholder="예: 20, 45lb" inputmode="decimal" value="${escAttr(d.weight)}">
      <button type="button" class="w-plus-btn" onclick="insertPlusInWeight(this)" tabindex="-1" title="+ 삽입 (원판 합산 표기, 예: 20+2.5)">+</button>
    </div>
    <input class="s" placeholder="예: 3" inputmode="numeric" value="${escAttr(d.sets)}">
    <input class="r" placeholder="예: 12" inputmode="numeric" value="${escAttr(d.reps)}">
    <input class="rir" placeholder="예: 2" inputmode="decimal" value="${escAttr(d.rir)}">
    <button type="button" class="set-del" onclick="removeSetRow(this)" title="이 행 삭제">✕</button>`;
  cont.appendChild(div);
}
// 세트 행 삭제 (마지막 한 행은 값만 비움)
function removeSetRow(btn){
  const row=btn.closest('.set-row'); if(!row) return;
  const cont=row.parentElement;
  if(cont.children.length>1) row.remove();
  else row.querySelectorAll('input').forEach(i=>i.value='');
}
// 무게 입력칸의 현재 커서 위치에 '+'를 넣어줌 (숫자 키패드엔 +가 없는 기기가 많아서 원판 합산 표기용으로 제공)
function insertPlusInWeight(btn){
  const input=btn.previousElementSibling;
  if(!input) return;
  const start=input.selectionStart ?? input.value.length;
  const end=input.selectionEnd ?? input.value.length;
  input.value=input.value.slice(0,start)+'+'+input.value.slice(end);
  input.focus();
  const pos=start+1;
  input.setSelectionRange(pos,pos);
}

function renumberRows(wrap){
  Array.from(wrap.children).forEach((el,i)=>{
    const el2=el.querySelector('.ex-input-num');
    if(el2) el2.textContent=i+1;
  });
}
function removeExRow(n){
  const el=document.getElementById('exrow-'+n);
  if(!el) return;
  const wrap=el.parentElement;
  el.remove();
  renumberRows(wrap);
}
function moveRow(n,dir){
  const el=document.getElementById('exrow-'+n);
  if(!el) return;
  const wrap=el.parentElement;
  const idx=Array.from(wrap.children).indexOf(el);
  const tgt=idx+dir;
  if(tgt<0||tgt>=wrap.children.length) return;
  if(dir===-1) wrap.insertBefore(el,wrap.children[tgt]);
  else wrap.insertBefore(wrap.children[tgt],el);
  renumberRows(wrap);
}
function onAcInput(input,n){
  const q=input.value.trim().toLowerCase();
  const dd=document.getElementById('ac-'+n);
  if(!q){dd.classList.remove('show');return;}
  const names=getExerciseNames().filter(x=>x.name.toLowerCase().includes(q)).slice(0,8);
  if(!names.length){dd.classList.remove('show');return;}
  dd.innerHTML=names.map(x=>`<div class="ac-item" onmousedown="selectAc(${n},'${x.name.replace(/'/g,"\\'")}')">
    ${x.name}<span class="ac-count">${x.count}회</span></div>`).join('');
  dd.classList.add('show');
}
// 특정 운동의 가장 최근 기록(첫 세트행) 반환
function getLatestRecord(name){
  let latest=null, latestDate='';
  DB.forEach(s=>s.exercises.forEach(e=>{
    if(e.name===name){
      const rows=exRows(e);
      if(rows.length && s.date>latestDate){ latestDate=s.date; latest=rows[0]; }
    }
  }));
  return latest;
}

function selectAc(n,name){
  const row=document.getElementById('exrow-'+n);
  if(!row) return;
  row.querySelector('.autocomplete-wrap input').value=name;
  document.getElementById('ac-'+n).classList.remove('show');

  // 같은 운동의 가장 최근 기록을 첫 세트행에 자동 채움 (빈 칸만)
  const latest=getLatestRecord(name);
  const first=row.querySelector('.set-row');
  if(latest && first){
    const w=first.querySelector('.w'), s=first.querySelector('.s'), r=first.querySelector('.r'), rir=first.querySelector('.rir');
    if(w && !w.value.trim() && latest.weight) w.value=latest.weight;
    if(s && !s.value.trim() && latest.sets)   s.value=latest.sets;
    if(r && !r.value.trim() && latest.reps)   r.value=latest.reps;
    if(rir && !rir.value.trim() && latest.rir) rir.value=latest.rir;
    toast('최근 기록 자동 입력됨');
  }
}
function hideAc(n){
  setTimeout(()=>{const dd=document.getElementById('ac-'+n);if(dd)dd.classList.remove('show');},150);
}
function clearForm(){
  document.getElementById('in-date').value=localDateStr(new Date());

function getExRowData(wrap){
  return Array.from(wrap.children).map(card=>{
    const name=card.querySelector('.autocomplete-wrap input')?.value.trim()||'';
    const note=card.querySelector('.ex-memo textarea')?.value.trim()||'';
    const exUnit=card.dataset.exUnit==='lbs' ? 'lbs' : 'kg'; // 이 운동 카드의 단위 토글(기본값은 생성 시 전역 기본 단위)
    const rows=Array.from(card.querySelectorAll('.set-row')).map(r=>{
      const w=r.querySelector('.w')?.value.trim()||'';
      return {
        // 단위를 안 적었으면 이 운동 카드에서 고른 단위를 확정해 찍음 (기기 간 동기화돼도 해석이 안 바뀌게)
        weight: w && !weightHasUnit(w) ? w+exUnit : w,
        sets:r.querySelector('.s')?.value.trim()||'',
        reps:r.querySelector('.r')?.value.trim()||'',
        rir:r.querySelector('.rir')?.value.trim()||'',
      };
    }).filter(x=>x.weight||x.sets||x.reps||x.rir);
    let video=null;
    if(card.dataset.videoType==='youtube' && card.dataset.videoUrl){
      video={type:'youtube', url:card.dataset.videoUrl};
    } else if(card.dataset.videoType==='upload' && card.dataset.videoId){
      video={type:'upload', videoId:card.dataset.videoId, name:card.dataset.videoName||''};
    }
    return {name,note,rows,video};
  }).filter(e=>e.name);
}
let savingSession=false;
function saveSession(){

function populateTrendSelect(){
  const sel=document.getElementById('trend-ex'), cur=sel.value;
  const names=getExerciseNames().filter(x=>{
    let cnt=0;
    DB.forEach(s=>s.exercises.forEach(e=>{ if(e.name===x.name && exMaxWeight(e)!==null) cnt++; }));
    return cnt>=2;
  });
  sel.innerHTML='<option value="">운동 선택…</option>'+
    `<option value="__volume__" ${cur==='__volume__'?'selected':''}>📊 주간 총 볼륨 (전체 운동 합산)</option>`+
    names.map(x=>`<option value="${x.name}" ${x.name===cur?'selected':''}>${x.name} (${x.count}회)</option>`).join('');
}
// 한 세트행의 총 볼륨(kg 환산 무게 × 세트 × 횟수). 무게나 횟수가 없으면(맨몸 운동 등) 0.
function rowVolumeKg(r){
  const wKg=weightToKg(r.weight);
  if(wKg===null) return 0;
  const reps=parseFloat(r.reps)||0;
  if(reps<=0) return 0;
  const sets=parseFloat(r.sets)||1; // 세트 수를 안 적었으면 1세트로 간주
  return wKg*reps*sets;
}
// 월요일 시작 기준 주간 키 (해당 주의 월요일 날짜)
function weekStart(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const day=(d.getDay()+6)%7; // 0=월 ... 6=일
  d.setDate(d.getDate()-day);
  return localDateStr(d);
}
// 그 주의 마지막 날(일요일) 날짜
function weekEnd(wkStartStr){
  const d=new Date(wkStartStr+'T00:00:00');
  d.setDate(d.getDate()+6);
  return localDateStr(d);
}
function renderWeeklyVolume(){
  const title=document.getElementById('trend-title');
  const sub=document.getElementById('trend-subtitle');
  const svg=document.getElementById('trend-svg');
  const pts=document.getElementById('trend-points');
  title.textContent='주간 총 볼륨'; title.style.color='var(--ink)';

  const weekMap={};
  DB.forEach(s=>{
    if(s.src==='planned') return; // 아직 안 한 예정 기록은 실제 볼륨에서 제외
    let sessionVol=0;
    s.exercises.forEach(e=>exRows(e).forEach(r=>{ sessionVol+=rowVolumeKg(r); }));
    if(sessionVol>0){ const wk=weekStart(s.date); weekMap[wk]=(weekMap[wk]||0)+sessionVol; }
  });
  const weeks=Object.keys(weekMap).sort();
  if(!weeks.length){
    sub.textContent='';
    svg.style.display='none';
    pts.innerHTML='<div class="empty" style="padding:20px 0">무게·세트·횟수가 함께 기록된 운동이 아직 없어요.</div>';
    return;
  }
  sub.textContent=`총 ${weeks.length}주 · ${weeks[0]} → ${weeks[weeks.length-1]} (월요일 시작 기준, kg 환산 합계)`;
  const chartData=weeks.map(wk=>({date:wk, wNum:Math.round(weekMap[wk]), src:'personal'}));
  if(chartData.length>=2){ svg.style.display='block'; drawChart(chartData); }
  else svg.style.display='none';
  const maxV=Math.max(...weeks.map(wk=>weekMap[wk]),1);
  // 최신 주가 맨 위로 오게 내림차순으로 표시
  pts.innerHTML=weeks.slice().reverse().map(wk=>{
    const v=weekMap[wk];
    const pct=Math.round((v/maxV)*100);
    return `<div class="tp-row-vol">
      <div class="tp-vol-date">${wk} ~ ${weekEnd(wk)}</div>
      <div class="tp-vol-bar-line">
        <div class="tp-bar-wrap"><div class="tp-bar" style="width:${pct}%"></div></div>
        <span class="tp-val">${Math.round(v).toLocaleString()}kg</span>
      </div>
    </div>`;
  }).join('');
}
function renderTrend(){
  const name=document.getElementById('trend-ex').value;
  if(name==='__volume__'){ renderWeeklyVolume(); return; }
  const title=document.getElementById('trend-title');
  const sub=document.getElementById('trend-subtitle');
  const svg=document.getElementById('trend-svg');
  const pts=document.getElementById('trend-points');
  if(!name){
    title.textContent='운동을 선택하면 추이가 표시됩니다.';
    title.style.color='var(--ink3)';
    sub.textContent='';svg.style.display='none';pts.innerHTML='';return;
  }
  const records=[];
  DB.forEach(s=>s.exercises.forEach(e=>{
    if(e.name!==name) return;
    // 가장 무거운 세트를 대표값으로 사용 (kg 환산 기준으로 비교 — lbs 기록도 올바르게 비교되게)
    let best=null, bestN=null;
    exRows(e).forEach(r=>{ const nn=weightToKg(r.weight); if(nn!==null && (bestN===null||nn>bestN)){ bestN=nn; best=r; } });
    const rr=best||exRows(e)[0]||{};
    records.push({date:s.date,weight:rr.weight||'',wNum:bestN,sets:rr.sets||'',reps:rr.reps||'',rir:rr.rir||'',note:e.note,src:s.src});
  }));
  records.sort((a,b)=>a.date.localeCompare(b.date));
  title.textContent=name; title.style.color='var(--ink)';
  sub.textContent=`총 ${records.length}회 · ${records[0].date} → ${records[records.length-1].date}`;
  const chartPts=records.filter(r=>r.wNum!==null);
  if(chartPts.length>=2){svg.style.display='block';drawChart(chartPts);}
  else svg.style.display='none';
  const maxW=Math.max(...records.map(r=>r.wNum||0),1);
  pts.innerHTML=records.map(r=>{
    const pct=r.wNum?Math.round((r.wNum/maxW)*100):0;
    const col=r.src==='planned'?'#997300':r.src==='personal'?'#2d5a3d':'#c8a060';
    const dot=`<span style="width:7px;height:7px;border-radius:50%;background:${col};flex-shrink:0;display:inline-block"></span>`;
    const noteFlat=r.note?escHtml(r.note).replace(/\n+/g,' '):'';
    const detail=[r.sets&&r.sets+'세트',r.reps&&r.reps+'회',r.rir&&'RIR '+r.rir,noteFlat].filter(Boolean).join(' ');
    return `<div class="tp-row">
      <span class="tp-date">${r.date.slice(5)}</span>${dot}
      <div class="tp-bar-wrap"><div class="tp-bar" style="width:${pct}%;background:${col}"></div></div>
      <span class="tp-val">${r.weight?displayWeight(r.weight):'—'}</span>
      <span class="tp-note">${detail}</span>
    </div>`;
  }).join('');
}
function drawChart(data){
  const scrollWrap=document.getElementById('trend-chart-scroll');
  const svg=document.getElementById('trend-svg');
  const H=170,P={t:16,r:16,b:28,l:32};
  const PER_POINT=56; // 포인트 사이 최소 간격(px) — 많아지면 이 너비만큼 넓어져 가로 스크롤됨
  const containerW=(scrollWrap&&scrollWrap.clientWidth)||340;
  const neededW=P.l+P.r+PER_POINT*Math.max(data.length-1,0);
  const W=Math.max(containerW,neededW);
  svg.setAttribute('width',W);
  svg.setAttribute('height',H);
  svg.style.width=W+'px';
  const iW=W-P.l-P.r,iH=H-P.t-P.b;
  const vals=data.map(d=>d.wNum);
  const minV=Math.min(...vals)*.88,maxV=Math.max(...vals)*1.06;
  const xs=i=>P.l+(data.length===1?iW/2:i/(data.length-1)*iW);
  const ys=v=>P.t+iH-((v-minV)/(maxV-minV))*iH;
  const path=data.map((d,i)=>(i===0?'M':'L')+xs(i)+','+ys(d.wNum)).join(' ');
  const area=path+` L${xs(data.length-1)},${P.t+iH} L${xs(0)},${P.t+iH} Z`;
  const circles=data.map((d,i)=>{
    const col=d.src==='planned'?'#997300':d.src==='personal'?'#2d5a3d':'#c8a060';
    return `<circle cx="${xs(i)}" cy="${ys(d.wNum)}" r="3.5" fill="${col}" stroke="#fff" stroke-width="1.5"/>
      <text x="${xs(i)}" y="${ys(d.wNum)-9}" text-anchor="middle" font-size="8.5" font-family="IBM Plex Mono,monospace" fill="#4a4a46">${Math.round(d.wNum*10)/10}</text>`;
  }).join('');
  const xLabels=data.map((d,i)=>
    `<text x="${xs(i)}" y="${H-2}" text-anchor="middle" font-size="8" font-family="IBM Plex Mono,monospace" fill="#8a8a84">${d.date.slice(5)}</text>`
  ).join('');
  svg.innerHTML=`<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2d5a3d" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#2d5a3d" stop-opacity=".02"/>
  </linearGradient></defs>
  <line x1="${P.l}" y1="${P.t}" x2="${P.l}" y2="${P.t+iH}" stroke="#ddd8ce" stroke-width="1"/>
  <line x1="${P.l}" y1="${P.t+iH}" x2="${P.l+iW}" y2="${P.t+iH}" stroke="#ddd8ce" stroke-width="1"/>
  <path d="${area}" fill="url(#tg)"/>
  <path d="${path}" fill="none" stroke="#2d5a3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  ${circles}${xLabels}
  <text x="${P.l-4}" y="${P.t+5}" text-anchor="end" font-size="8" font-family="IBM Plex Mono,monospace" fill="#8a8a84">${Math.round(maxV)}</text>
  <text x="${P.l-4}" y="${P.t+iH+3}" text-anchor="end" font-size="8" font-family="IBM Plex Mono,monospace" fill="#8a8a84">${Math.round(minV)}</text>
  <text x="${P.l}" y="${P.t-5}" font-size="7.5" font-family="IBM Plex Mono,monospace" fill="#8a8a84">kg</text>`;
  // 최신 데이터(맨 오른쪽)가 보이는 위치로 스크롤 (레이아웃 반영 후 실행되게 다음 프레임에)
  if(scrollWrap) requestAnimationFrame(()=>{ scrollWrap.scrollLeft=scrollWrap.scrollWidth; });
}

// 다운로드 시도 + 실패 시 텍스트 표시 폴백
function downloadOrShow(filename, content, mime){
  try {
    const blob=new Blob([content],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    // 다운로드가 샌드박스에서 막힐 수 있으니, 복사용 모달도 함께 제공
    showCopyModal(filename, content);
  } catch(e){
    showCopyModal(filename, content);
  }
}

// 내용을 복사할 수 있는 모달 표시

function copyExportText(){

    try{ document.execCommand('copy'); toast('✓ 복사됨'); }catch(_){ toast('직접 선택해 복사하세요'); }
  }
}

    <div id="sync-status" style="font-size:.72rem;min-height:18px;margin-bottom:10px;color:var(--ink3)"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="testSync()">연결 테스트</button>
      <button class="btn btn-primary btn-sm" onclick="saveSyncSettings()">저장 및 동기화</button>
      ${cur?`<button class="btn btn-ghost btn-sm" onclick="pullFromCloud()">클라우드에서 새로고침</button>
      <button class="btn btn-danger btn-sm" onclick="disconnectSync()">연결 해제</button>`:''}
    </div>`;
  document.querySelector('#modal h2').textContent='클라우드 동기화';
  document.querySelector('.modal-actions').style.display='none';
  document.getElementById('modal-overlay').classList.add('show');
}

function syncStatus(msg,type){
  const st=document.getElementById('sync-status');
  if(!st) return;
  st.style.color = type==='ok' ? 'var(--accent)' : type==='err' ? 'var(--warn)' : 'var(--ink3)';
  st.textContent=msg;
}

async function testSync(){
  const url=document.getElementById('sync-url').value.trim();
  if(!url){ syncStatus('URL을 입력하세요.','err'); return; }
  syncStatus('연결 중…');
  try {
    const data=await cloudLoad(url);
    syncStatus('✓ 연결 성공 — 클라우드에 세션 '+data.length+'개','ok');
  } catch(e){
    syncStatus('✗ 연결 실패: '+e.message,'err');
  }
}

async function saveSyncSettings(){
  const url=document.getElementById('sync-url').value.trim();
  if(!url){ syncStatus('URL을 입력하세요.','err'); return; }
  syncStatus('연결 및 동기화 중…');
  let cloudData;
  try { cloudData=await cloudLoad(url); }
  catch(e){ syncStatus('✗ 연결 실패: '+e.message+' — URL을 확인하세요.','err'); return; }
  localStorage.setItem(CLOUD_URL_KEY,url);
  const localN=DB.length, cloudN=cloudData.length;
  if(cloudN>0 && localN>0){
    const useCloud=confirm(`클라우드에 세션 ${cloudN}개, 이 기기에 ${localN}개가 있습니다.\n\n[확인] = 클라우드 내용을 이 기기로 가져오기\n[취소] = 이 기기 내용을 클라우드로 올리기`);
    if(useCloud){ DB=cloudData; normalizeDB(); dbDirty=false; localStorage.removeItem(PENDING_PUSH_KEY); localStorage.setItem(STORAGE_KEY,JSON.stringify(DB)); }
    else { saveDB(); }
  } else if(cloudN>0){
    DB=cloudData; normalizeDB(); dbDirty=false; localStorage.removeItem(PENDING_PUSH_KEY); localStorage.setItem(STORAGE_KEY,JSON.stringify(DB));
  } else if(localN>0){
    saveDB();
  }
  updateSyncBtn(); closeModal(); renderLog(); populateTrendSelect();
  toast('✓ 클라우드 동기화 연결됨');
}

async function pullFromCloud(){
  syncStatus('불러오는 중…');
  try {
    const data=await cloudLoad();
    DB=data; normalizeDB(); dbDirty=false; localStorage.removeItem(PENDING_PUSH_KEY);
    localStorage.setItem(STORAGE_KEY,JSON.stringify(DB));
    closeModal(); renderLog(); populateTrendSelect();
    toast('✓ 클라우드에서 '+data.length+'개 불러옴');
  } catch(e){
    syncStatus('✗ 실패: '+e.message,'err');
  }
}

function disconnectSync(){
  if(!confirm('클라우드 연결을 해제할까요?\n이 기기의 데이터는 그대로 유지됩니다.')) return;
  localStorage.removeItem(CLOUD_URL_KEY);
  updateSyncBtn(); closeModal();
  toast('연결 해제됨 (이 기기 저장만 사용)');
}

function exportJSON(){
  const content=JSON.stringify(DB,null,2);
  const filename='운동일지_'+localDateStr(new Date())+'.json';
  downloadOrShow(filename, content, 'application/json');
}
function exportCSV(){
  const rows=[['날짜','출처','메모','운동명','무게','세트','횟수','RIR','운동메모']];
  [...DB].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>
    s.exercises.forEach(e=>{
      const srcLbl=s.src==='personal'?'개인일지':s.src==='planned'?'예정':'세션지';
      const ers=exRows(e);
      if(!ers.length){
        rows.push([s.date,srcLbl,s.memo||'',e.name,'','','','',e.note||'']);
      } else {
        ers.forEach(r=>rows.push([s.date,srcLbl,s.memo||'',e.name,r.weight?displayWeight(r.weight):'',r.sets||'',r.reps||'',r.rir||'',e.note||'']));
      }
    })
  );
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const filename='운동일지_'+localDateStr(new Date())+'.csv';
  downloadOrShow(filename, '\uFEFF'+csv, 'text/csv;charset=utf-8');
}

document.addEventListener('DOMContentLoaded', ()=>{
  // 검색 입력 이벤트 연결
  document.getElementById('filter-ex').addEventListener('input', ()=>{ renderLog(); updateFilterClearBtn(); });
  clearForm();
  updateSyncBtn();
  updateUnitToggle();

  // 1) 로컬 캐시를 즉시 표시 (스피너 없이 바로 렌더)
  const hadCache = loadLocal();
  if(!hadCache && getCloudUrl()){
    // 캐시가 없고 클라우드 연결됨 → 첫 동기화 동안만 잠깐 표시
    document.getElementById('session-list').innerHTML =
      `<div class="empty"><div class="empty-icon">⏳</div>불러오는 중…</div>`;
  } else {
    renderLog();
  }

  // 2) 백그라운드에서 클라우드와 동기화 (도착하면 자동 갱신)
  backgroundSync();
});
</script>
