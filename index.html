    {average:false, unit:'kg', subSuffix:'(월요일 시작 기준, kg 환산 합계)', emptyMsg:'무게·세트·횟수가 함께 기록된 운동이 아직 없어요.'}
  );
}
// 일별 섭취 칼로리가 유지칼로리 대비 목표 데피싯 구간(훈련일/비훈련일 다름)을 지키고 있는지 추적
function renderCalorieDeficitChart(){
  const sub=document.getElementById('cal-subtitle');
  const svg=document.getElementById('cal-svg');
  const legend=document.getElementById('cal-legend');
  const summaryBox=document.getElementById('cal-summary');
  const pts=document.getElementById('cal-points');
  const goal=getCalorieGoal();
  const tdee=parseFloat(goal.tdee)||2107;
  const trainMin=parseFloat(goal.trainMin)||24, trainMax=parseFloat(goal.trainMax)||29;
  const restMin=parseFloat(goal.restMin)||34, restMax=parseFloat(goal.restMax)||38;

  // 하루에 식단 기록이 여러 건이면(같은 날 두 번 저장 등) 그 날짜 안에서 먼저 합산
  const dayMap={};
  MEAL_DB.forEach(m=>{
    const total=m.meals.reduce((s,x)=>s+(parseFloat(x.calories)||0),0);
    if(total>0) dayMap[m.date]=(dayMap[m.date]||0)+total;
  });
  const dates=Object.keys(dayMap).sort();
  if(!dates.length){
    sub.textContent=''; svg.style.display='none'; legend.innerHTML=''; summaryBox.innerHTML='';
    pts.innerHTML='<div class="empty" style="padding:16px 0">칼로리가 기록된 식단이 아직 없어요.</div>';
    return;
  }
  sub.textContent=`총 ${dates.length}일 · ${dates[0]} → ${dates[dates.length-1]} · 유지칼로리 ${tdee}kcal 기준`;

  const records=dates.map(date=>{
    const cal=dayMap[date];
    const deficit=tdee-cal;
    const pct=Math.round((deficit/tdee)*1000)/10;
    const training=isTrainingDay(date);
    const [lo,hi]=training?[trainMin,trainMax]:[restMin,restMax];
    const status = pct>hi ? '초과 절식' : pct<lo ? '미달' : '적정';
    return {date, cal, pct, training, status};
  });

  svg.style.display='block';
  drawCalorieDeficitSvg(records, {trainMin,trainMax,restMin,restMax});

  legend.innerHTML=`
    <span class="trend-legend-item"><span class="trend-legend-swatch" style="background:#2d5a3d"></span>훈련일</span>
    <span class="trend-legend-item"><span class="trend-legend-swatch" style="background:#997300"></span>비훈련일</span>
    <span class="trend-legend-item"><span class="trend-legend-swatch line" style="background:#4a4a46"></span>주간 평균</span>
    <span class="trend-legend-item"><span class="trend-legend-swatch" style="background:transparent;border:2px solid var(--warn)"></span>목표 이탈</span>`;

  const counts={'적정':0,'초과 절식':0,'미달':0};
  records.forEach(r=>counts[r.status]++);
  summaryBox.innerHTML=`적정 <b>${counts['적정']}</b>일 · 초과 절식 <b>${counts['초과 절식']}</b>일 · 미달 <b>${counts['미달']}</b>일 (총 ${records.length}일)`;

  pts.innerHTML=records.slice().reverse().map(r=>{
    const col = r.status==='적정' ? 'var(--accent)' : r.status==='초과 절식' ? 'var(--warn)' : 'var(--plan)';
    return `<div class="tp-row-vol">
      <div class="tp-vol-date">${r.date} · ${r.training?'훈련일':'비훈련일'}</div>
      <div class="tp-vol-bar-line">
        <span style="font-family:var(--mono);font-size:.72rem;color:${col};font-weight:600;flex-shrink:0">${r.status}</span>
        <span class="tp-val" style="width:auto">${r.cal.toLocaleString()}kcal (${r.pct}%)</span>
      </div>
    </div>`;
  }).join('');
}
function drawCalorieDeficitSvg(records, ranges){
  const scrollWrap=document.getElementById('cal-scroll');
  const svg=document.getElementById('cal-svg');
  const H=210, P={t:16,r:16,b:34,l:32};
  const PER_POINT=42;
  const containerW=(scrollWrap&&scrollWrap.clientWidth)||340;
  const n=records.length;
  const neededW=P.l+P.r+PER_POINT*Math.max(n-1,0);
  const W=Math.max(containerW,neededW);
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  svg.style.width=W+'px'; svg.style.height=H+'px';
  const iW=W-P.l-P.r, iH=H-P.t-P.b;
  const xs=i=> n===1 ? P.l+iW/2 : P.l+i/(n-1)*iW;

  const allBounds=[ranges.trainMin,ranges.trainMax,ranges.restMin,ranges.restMax,...records.map(r=>r.pct)];
  const yMin=Math.min(...allBounds)-5, yMax=Math.max(...allBounds)+5;
  const ys=v=>P.t+iH-((v-yMin)/(yMax-yMin||1))*iH;

  const trainBand=`<rect x="${P.l}" y="${ys(ranges.trainMax)}" width="${iW}" height="${Math.max(ys(ranges.trainMin)-ys(ranges.trainMax),0)}" fill="#2d5a3d" opacity="0.10"/>`;
  const restBand=`<rect x="${P.l}" y="${ys(ranges.restMax)}" width="${iW}" height="${Math.max(ys(ranges.restMin)-ys(ranges.restMax),0)}" fill="#997300" opacity="0.10"/>`;

  // 주간 평균 라인 (그 주에 속한 포인트들의 중간 인덱스에 찍어 이어줌)
  const weekMap={};
  records.forEach((r,i)=>{
    const wk=weekStart(r.date);
    if(!weekMap[wk]) weekMap[wk]={sum:0,count:0,idxs:[]};
    weekMap[wk].sum+=r.pct; weekMap[wk].count++; weekMap[wk].idxs.push(i);
  });
  const weekAvgPath=Object.keys(weekMap).sort().map((wk,wi)=>{
    const w=weekMap[wk];
    const midIdx=w.idxs.reduce((a,b)=>a+b,0)/w.idxs.length;
    return `${wi===0?'M':'L'}${xs(midIdx)},${ys(w.sum/w.count)}`;
  }).join(' ');

  const points=records.map((r,i)=>{
    const outOfRange=r.status!=='적정';
    const col=r.training?'#2d5a3d':'#997300';
    const ring=outOfRange?`stroke="var(--warn)" stroke-width="2.5"`:`stroke="#fff" stroke-width="1.3"`;
    return `<circle cx="${xs(i)}" cy="${ys(r.pct)}" r="5" fill="${col}" ${ring}/>
      <text x="${xs(i)}" y="${ys(r.pct)-9}" text-anchor="middle" font-size="7.5" font-family="IBM Plex Mono,monospace" fill="#4a4a46">${r.pct}%</text>`;
  }).join('');
  const xLabels=records.map((r,i)=>`<text x="${xs(i)}" y="${H-4}" text-anchor="middle" font-size="7.5" font-family="IBM Plex Mono,monospace" fill="#8a8a84">${r.date.slice(5)}</text>`).join('');

  svg.innerHTML=`
    ${trainBand}${restBand}
    <line x1="${P.l}" y1="${P.t}" x2="${P.l}" y2="${P.t+iH}" stroke="#ddd8ce" stroke-width="1"/>
    <line x1="${P.l}" y1="${P.t+iH}" x2="${P.l+iW}" y2="${P.t+iH}" stroke="#ddd8ce" stroke-width="1"/>
    <path d="${weekAvgPath}" fill="none" stroke="#4a4a46" stroke-width="1.8" stroke-dasharray="5,3"/>
    ${points}${xLabels}
    <text x="${P.l-4}" y="${P.t+4}" text-anchor="end" font-size="7.5" font-family="IBM Plex Mono,monospace" fill="#8a8a84">${Math.round(yMax)}%</text>
    <text x="${P.l-4}" y="${P.t+iH+3}" text-anchor="end" font-size="7.5" font-family="IBM Plex Mono,monospace" fill="#8a8a84">${Math.round(yMin)}%</text>
  `;
  if(scrollWrap) requestAnimationFrame(()=>{ scrollWrap.scrollLeft=scrollWrap.scrollWidth; });
}
function renderTrendSummary(){
  populateGoalInputs();
  renderWeightBodyFatChart();
  renderWeeklyVolume();
  renderCalorieDeficitChart();
}
function drawChart(data, svgId, scrollId, unit){
  svgId=svgId||'trend-svg'; scrollId=scrollId||'trend-chart-scroll'; unit=unit||'kg';
  const scrollWrap=document.getElementById(scrollId);
  const svg=document.getElementById(svgId);
  const H=170,P={t:16,r:16,b:28,l:32};
  const PER_POINT=56; // 포인트 사이 최소 간격(px) — 많아지면 이 너비만큼 넓어져 가로 스크롤됨
  const containerW=(scrollWrap&&scrollWrap.clientWidth)||340;
  const neededW=P.l+P.r+PER_POINT*Math.max(data.length-1,0);
  const W=Math.max(containerW,neededW);
  svg.setAttribute('width',W);
  svg.setAttribute('height',H);
  svg.style.width=W+'px'; svg.style.height=H+'px';
  const iW=W-P.l-P.r,iH=H-P.t-P.b;
  const vals=data.map(d=>d.wNum);
  const minV=Math.min(...vals)*.88,maxV=Math.max(...vals)*1.06;
  const xs=i=>P.l+(data.length===1?iW/2:i/(data.length-1)*iW);
  const ys=v=>P.t+iH-((v-minV)/(maxV-minV))*iH;
  const path=data.map((d,i)=>(i===0?'M':'L')+xs(i)+','+ys(d.wNum)).join(' ');
  const area=path+` L${xs(data.length-1)},${P.t+iH} L${xs(0)},${P.t+iH} Z`;
  const circles=data.map((d,i)=>{
    const col=d.src==='planned'?'#997300':d.src==='personal'?'#2d5a3d':'#c8a060';
    return `<circle cx="${xs(i)}" cy="${ys(d.wNum)}" r="3.5" fill="${col}" stroke="#fff" stroke-width="1.5"/>
      <text x="${xs(i)}" y="${ys(d.wNum)-9}" text-anchor="middle" font-size="8.5" font-family="IBM Plex Mono,monospace" fill="#4a4a46">${Math.round(d.wNum*10)/10}</text>`;
  }).join('');
  const xLabels=data.map((d,i)=>
    `<text x="${xs(i)}" y="${H-2}" text-anchor="middle" font-size="8" font-family="IBM Plex Mono,monospace" fill="#8a8a84">${d.date.slice(5)}</text>`
  ).join('');
  svg.innerHTML=`<defs><linearGradient id="tg-${svgId}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2d5a3d" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#2d5a3d" stop-opacity=".02"/>
  </linearGradient></defs>
  <line x1="${P.l}" y1="${P.t}" x2="${P.l}" y2="${P.t+iH}" stroke="#ddd8ce" stroke-width="1"/>
  <line x1="${P.l}" y1="${P.t+iH}" x2="${P.l+iW}" y2="${P.t+iH}" stroke="#ddd8ce" stroke-width="1"/>
  <path d="${area}" fill="url(#tg-${svgId})"/>
  <path d="${path}" fill="none" stroke="#2d5a3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  ${circles}${xLabels}
  <text x="${P.l-4}" y="${P.t+5}" text-anchor="end" font-size="8" font-family="IBM Plex Mono,monospace" fill="#8a8a84">${Math.round(maxV)}</text>
  <text x="${P.l-4}" y="${P.t+iH+3}" text-anchor="end" font-size="8" font-family="IBM Plex Mono,monospace" fill="#8a8a84">${Math.round(minV)}</text>
  <text x="${P.l}" y="${P.t-5}" font-size="7.5" font-family="IBM Plex Mono,monospace" fill="#8a8a84">${unit}</text>`;
  // 최신 데이터(맨 오른쪽)가 보이는 위치로 스크롤 (레이아웃 반영 후 실행되게 다음 프레임에)
  if(scrollWrap) requestAnimationFrame(()=>{ scrollWrap.scrollLeft=scrollWrap.scrollWidth; });
}

// ══════════════════════════════════
// 내보내기
// ══════════════════════════════════
// 다운로드 시도 + 실패 시 텍스트 표시 폴백
function downloadOrShow(filename, content, mime){
  try {
    const blob=new Blob([content],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    // 다운로드가 샌드박스에서 막힐 수 있으니, 복사용 모달도 함께 제공
    showCopyModal(filename, content);
  } catch(e){
    showCopyModal(filename, content);
  }
}

// 내용을 복사할 수 있는 모달 표시
function showCopyModal(filename, content){
  document.getElementById('modal-body').innerHTML=`
    <p style="font-size:.8rem;color:var(--ink2);margin-bottom:10px">
      <strong>${filename}</strong><br>
      아래 내용을 길게 눌러 전체 선택 → 복사한 뒤 메모앱이나 파일로 저장하세요.
      (다운로드가 됐다면 무시해도 됩니다.)
    </p>
    <textarea id="export-text" readonly style="width:100%;height:300px;font-family:var(--mono);font-size:.7rem;padding:10px;border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);resize:vertical">${content.replace(/</g,'&lt;')}</textarea>
    <button class="btn btn-primary" style="margin-top:10px;width:100%" onclick="copyExportText()">전체 복사</button>
  `;
  document.querySelector('#modal h2').textContent='내보내기';
  document.querySelector('.modal-actions').style.display='none';
  document.getElementById('modal-overlay').classList.add('show');
}
function copyExportText(){
  const ta=document.getElementById('export-text');
  ta.select();
  try {
    navigator.clipboard.writeText(ta.value).then(
      ()=>toast('✓ 복사됨'),
      ()=>{ document.execCommand('copy'); toast('✓ 복사됨'); }
    );
  } catch(e){
    try{ document.execCommand('copy'); toast('✓ 복사됨'); }catch(_){ toast('직접 선택해 복사하세요'); }
  }
}

// ══════════════════════════════════
// 클라우드 동기화 설정 모달
// ══════════════════════════════════
function openSyncSettings(){
  const cur=getCloudUrl();
  document.getElementById('modal-body').innerHTML=`
    <p style="font-size:.8rem;color:var(--ink2);margin-bottom:12px;line-height:1.55">
      Google 스프레드시트와 여러 기기 간 자동 동기화를 하려면,
      배포한 <strong>Apps Script 웹앱 URL</strong>(<code>.../exec</code>)을 붙여넣으세요.<br>
      이 값은 <strong>이 기기에만</strong> 저장되며 코드·저장소에는 올라가지 않습니다.
    </p>
    <label style="font-family:var(--mono);font-size:.62rem;letter-spacing:.07em;color:var(--ink3);text-transform:uppercase">웹앱 URL</label>
    <input id="sync-url" type="url" value="${cur.replace(/"/g,'&quot;')}" placeholder="https://script.google.com/macros/s/.../exec"
      style="width:100%;font-family:var(--mono);font-size:.72rem;padding:9px 10px;border:1px solid var(--rule);border-radius:6px;margin:6px 0 8px;background:#fff;color:var(--ink);outline:none">
    <div id="sync-status" style="font-size:.72rem;min-height:18px;margin-bottom:10px;color:var(--ink3)"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="testSync()">연결 테스트</button>
      <button class="btn btn-primary btn-sm" onclick="saveSyncSettings()">저장 및 동기화</button>
      ${cur?`<button class="btn btn-ghost btn-sm" onclick="pullFromCloud()">클라우드에서 새로고침</button>
      <button class="btn btn-danger btn-sm" onclick="disconnectSync()">연결 해제</button>`:''}
    </div>`;
  document.querySelector('#modal h2').textContent='클라우드 동기화';
  document.querySelector('.modal-actions').style.display='none';
  document.getElementById('modal-overlay').classList.add('show');
}

function syncStatus(msg,type){
  const st=document.getElementById('sync-status');
  if(!st) return;
  st.style.color = type==='ok' ? 'var(--accent)' : type==='err' ? 'var(--warn)' : 'var(--ink3)';
  st.textContent=msg;
}

async function testSync(){
  const url=document.getElementById('sync-url').value.trim();
  if(!url){ syncStatus('URL을 입력하세요.','err'); return; }
  syncStatus('연결 중…');
  try {
    const cloud=await cloudLoad(url);
    syncStatus(`✓ 연결 성공 — 클라우드에 세션 ${cloud.sessions.length}개 · 체중 ${cloud.weights.length}개 · 식단 ${cloud.meals.length}개`,'ok');
  } catch(e){
    syncStatus('✗ 연결 실패: '+e.message,'err');
  }
}

function applyCloudData_(cloud){
  DB=cloud.sessions; normalizeDB();
  WEIGHT_DB=cloud.weights; normalizeWeightDB();
  MEAL_DB=cloud.meals; normalizeMealDB();
  dbDirty=false; localStorage.removeItem(PENDING_PUSH_KEY);
  persistLocal();
}

async function saveSyncSettings(){
  const url=document.getElementById('sync-url').value.trim();
  if(!url){ syncStatus('URL을 입력하세요.','err'); return; }
  syncStatus('연결 및 동기화 중…');
  let cloud;
  try { cloud=await cloudLoad(url); }
  catch(e){ syncStatus('✗ 연결 실패: '+e.message+' — URL을 확인하세요.','err'); return; }
  localStorage.setItem(CLOUD_URL_KEY,url);
  const localN=DB.length, cloudN=cloud.sessions.length;
  if(cloudN>0 && localN>0){
    const useCloud=confirm(`클라우드에 세션 ${cloudN}개, 이 기기에 ${localN}개가 있습니다.\n\n[확인] = 클라우드 내용을 이 기기로 가져오기\n[취소] = 이 기기 내용을 클라우드로 올리기`);
    if(useCloud){ applyCloudData_(cloud); }
    else { saveDB(); }
  } else if(cloudN>0){
    applyCloudData_(cloud);
  } else if(localN>0){
    saveDB();
  }
  updateSyncBtn(); closeModal(); renderLog(); renderWeightLog(); renderMealLog(); renderTrendSummary();
  toast('✓ 클라우드 동기화 연결됨');
}

async function pullFromCloud(){
  syncStatus('불러오는 중…');
  try {
    const cloud=await cloudLoad();
    applyCloudData_(cloud);
    closeModal(); renderLog(); renderWeightLog(); renderMealLog(); renderTrendSummary();
    toast(`✓ 클라우드에서 세션 ${DB.length}개 · 체중 ${WEIGHT_DB.length}개 · 식단 ${MEAL_DB.length}개 불러옴`);
  } catch(e){
    syncStatus('✗ 실패: '+e.message,'err');
  }
}

function disconnectSync(){
  if(!confirm('클라우드 연결을 해제할까요?\n이 기기의 데이터는 그대로 유지됩니다.')) return;
  localStorage.removeItem(CLOUD_URL_KEY);
  updateSyncBtn(); closeModal();
  toast('연결 해제됨 (이 기기 저장만 사용)');
}

function exportJSON(){
  const content=JSON.stringify(DB,null,2);
  const filename='운동일지_'+localDateStr(new Date())+'.json';
  downloadOrShow(filename, content, 'application/json');
}
function exportCSV(){
  const rows=[['날짜','출처','메모','운동명','무게','세트','횟수','RIR','운동메모']];
  [...DB].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>
    s.exercises.forEach(e=>{
      const srcLbl=s.src==='personal'?'개인일지':s.src==='planned'?'예정':'세션지';
      const ers=exRows(e);
      if(!ers.length){
        rows.push([s.date,srcLbl,s.memo||'',e.name,'','','','',e.note||'']);
      } else {
        ers.forEach(r=>rows.push([s.date,srcLbl,s.memo||'',e.name,r.weight?displayWeight(r.weight):'',r.sets||'',r.reps||'',r.rir||'',e.note||'']));
      }
    })
  );
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const filename='운동일지_'+localDateStr(new Date())+'.csv';
  downloadOrShow(filename, '\uFEFF'+csv, 'text/csv;charset=utf-8');
}

document.addEventListener('DOMContentLoaded', ()=>{
  // 검색 입력 이벤트 연결
  document.getElementById('filter-ex').addEventListener('input', ()=>{ renderLog(); updateFilterClearBtn(); });
  clearForm();
  clearWeightForm();
  clearMealForm();
  updateSyncBtn();
  updateUnitToggle();

  // 1) 로컬 캐시를 즉시 표시 (스피너 없이 바로 렌더)
  const hadCache = loadLocal();
  if(!hadCache && getCloudUrl()){
    // 캐시가 없고 클라우드 연결됨 → 첫 동기화 동안만 잠깐 표시
    document.getElementById('session-list').innerHTML =
      `<div class="empty"><div class="empty-icon">⏳</div>불러오는 중…</div>`;
  } else {
    renderLog();
  }
  renderWeightLog();
  renderMealLog();

  // 2) 백그라운드에서 클라우드와 동기화 (도착하면 자동 갱신)
  backgroundSync();
});
